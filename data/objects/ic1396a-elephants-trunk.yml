id: ic1396a
name: "Туманність Хобот Слона"
type: "Емісійна туманність"
constellation: "Цефей"
aliases: ["IC 1396A", "Elephant's Trunk Nebula", "vdB 142"]
distance_ly: 2400
description: "Туманність Хобот Слона - щільна витягнута глобула газу й пилу в межах великої емісійної туманності IC 1396 у сузір'ї Цефея. Темний звивистий «хобот» довжиною близько 20 світлових років підсвічується випромінюванням масивної зорі, а всередині нього народжуються нові зорі."
extended_description: "IC 1396A - найпомітніша глобула у складі емісійного комплексу IC 1396, що охоплює понад 3 градуси неба в сузір'ї Цефея. Характерну форму «хобота» створює щільна холодна хмара газу й пилу, краї якої іонізуються та стискаються потужним ультрафіолетовим випромінюванням гарячої зорі-гіганта HD 206267 в центрі комплексу. Цей процес запускає нове зореутворення: інфрачервоні спостереження виявили всередині глобули численні протозорі та молоді зорі віком менше 100 тисяч років. Яскрава окантовка хобота світиться у лінії іонізованого водню (Hα), що надає туманності насиченого червоного відтінку на астрофотографіях."
