id: ic1805
name: "Туманність Серце"
type: "Емісійна туманність"
constellation: "Кассіопея"
aliases: ["IC 1805", "Heart Nebula", "Sh2-190", "Westerhout 4 (W4)"]
distance_ly: 7500
description: "Велика емісійна туманність у сузір'ї Кассіопеї, що разом із сусідньою IC 1848 (Туманність Душа) утворює відому пару «Серце і Душа». Її яскравий центр — молоде розсіяне скупчення Melotte 15, чиї масивні гарячі зорі іонізують навколишній водень."
extended_description: "IC 1805 лежить у рукаві Персея нашої Галактики на відстані близько 7 500 світлових років і простягається майже на 2° неба — учетверо більше за діаметр повного Місяця. Туманність є найяскравішою частиною надбульбашки W4 і входить до великого зореутворювального комплексу W3/W4/W5. У центрі розташоване скупчення Melotte 15 (Collinder 26), кілька зір якого мають масу близько 50 сонячних; саме їх випромінювання та зоряний вітер формують хвилясті краї й темні пилові смуги «серця». Туманність відкрив Вільям Гершель 3 листопада 1787 року. На цьому фото поєднано дані трьох фільтрів: RGB (UV/IR-cut) та вузькосмугових Ha+OIII і SII+OIII."
