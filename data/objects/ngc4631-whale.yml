id: ngc4631
name: "Галактика Кит та Хокейна Клюшка"
type: "Галактика"
constellation: "Гончі Пси"
aliases: ["NGC 4631", "NGC 4656", "Whale Galaxy", "Hockey Stick Galaxy", "Caldwell 32"]
distance_ly: 25000000
description: "Пара взаємодіючих галактик у сузір'ї Гончих Псів. NGC 4631 (Кит) — спіральна галактика, видима з ребра, що нагадує кита. NGC 4656 (Хокейна Клюшка) — галактика-компаньйон, деформована гравітаційним впливом сусідки."
extended_description: "NGC 4631 (Галактика Кит) — велика спіральна галактика діаметром близько 140 000 світлових років, видима з ребра. Має характерну клиноподібну форму, що нагадує кита. Над і під диском спостерігається велике гало з гарячого газу, що свідчить про активне зореутворення. NGC 4656/4657 (Хокейна Клюшка) — неправильна галактика на відстані ~25 млн світлових років, сильно деформована гравітаційним припливним впливом NGC 4631. Її зігнута форма нагадує хокейну клюшку. Разом ці галактики утворюють ефектну взаємодіючу пару в сузір'ї Гончих Псів."
