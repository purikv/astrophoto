id: ngc4631
name: "Галактика Кит"
type: "Галактика"
constellation: "Гончі Пси"
aliases: ["NGC 4631", "Whale Galaxy", "Caldwell 32"]
distance_ly: 25000000
description: "Спіральна галактика, видима з ребра, що нагадує кита. Поруч розташована галактика-компаньйон NGC 4656 — Хокейна Клюшка, витягнута гравітаційною взаємодією."
extended_description: "NGC 4631 — велика спіральна галактика діаметром близько 140 000 світлових років у сузір'ї Гончих Псів. Галактика видима з ребра і має характерну клиноподібну форму, що нагадує кита. Над і під диском спостерігається велике гало з гарячого газу, що свідчить про активне зореутворення. Поруч знаходиться галактика NGC 4656/4657 (Хокейна Клюшка), деформована гравітаційним впливом NGC 4631. Ці галактики утворюють взаємодіючу пару."
