id: ngc7023
name: "Туманність Ірис"
type: "Туманність"
constellation: "Цефей"
aliases: ["NGC 7023", "Caldwell 4", "Iris Nebula"]
distance_ly: 1300
description: "Відбивна туманність у сузір'ї Цефея, що отримала свою назву завдяки складній структурі, яка нагадує квітку ірису. У центрі туманності знаходиться молода блакитна зірка HD 200775, світло якої розсіюється на навколишніх хмарах пилу, надаючи туманності характерного блакитного кольору."
extended_description: "NGC 7023 - одна з найвідоміших відбивних туманностей у північному небі. Туманність розташована в межах більшої молекулярної хмари LDN 1174 і має діаметр близько 6 світлових років. Зірка-освітлювач HD 200775 - молода зірка спектрального класу Be, у 10 разів масивніша за Сонце. Окрім блакитного відбивного компонента, в туманності спостерігається червонувате випромінювання так званих 'червоних світних смуг' (Extended Red Emission), що походить від великих органічних молекул - поліциклічних ароматичних вуглеводнів (PAH). Темні запилені волокна навколо туманності - місця активного зореутворення."
