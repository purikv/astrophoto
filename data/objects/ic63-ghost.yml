id: ic63
name: "Туманність Привид Кассіопеї"
type: "Емісійно-відбивна туманність"
constellation: "Кассіопея"
aliases: ["IC 63", "Ghost of Cassiopeia", "Ghost Nebula", "Sh2-185"]
distance_ly: 10500
description: "Туманність Привид Кассіопеї — хмара газу й пилу поруч із яскравою зорею γ Кассіопеї, що одночасно світиться власним випромінюванням іонізованого водню та відбиває блакитне світло зорі. Разом із сусідньою IC 59 входить до області H II Sh2-185."
extended_description: "IC 63 розташована приблизно за 10 500 світлових років від нас і має видимий розмір близько 10 кутових хвилин. Потужне ультрафіолетове випромінювання гарячої масивної зорі γ Cas іонізує газ туманності, надаючи їй червоного свічення у лінії Hα, тоді як пил відбиває блакитне світло зорі. IC 63 та IC 59 є найближчими до Сонця областями фотодисоціації — зонами, де випромінювання зорі поступово руйнує молекулярну хмару. На знімку видно саму γ Cas (ліворуч угорі), IC 63 у центрі та слабшу IC 59 праворуч угорі."
