id: ngc4565
name: "Галактика Голка"
type: "Галактика"
constellation: "Волосся Вероніки"
aliases: ["NGC 4565", "Needle Galaxy", "Caldwell 38"]
distance_ly: 42000000
description: "Спіральна галактика, видима майже точно з ребра, що надає їй характерного вигляду тонкої голки з яскравою пиловою смугою. Одна з найвідоміших галактик, видимих з ребра."
extended_description: "NGC 4565 — велика спіральна галактика діаметром близько 100 000 світлових років, що є членом скупчення галактик у Волоссі Вероніки. Завдяки орієнтації майже точно з ребра (кут нахилу ~86°) чудово видно центральне потовщення (балдж) та темну пилову смугу, що перетинає диск галактики. Деякі астрономи вважають, що NGC 4565 за структурою подібна до нашого Чумацького Шляху."
