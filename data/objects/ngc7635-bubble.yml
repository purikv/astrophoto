id: ngc7635
name: "Туманність Бульбашка"
type: "Емісійна туманність"
constellation: "Кассіопея"
aliases: ["NGC 7635", "Bubble Nebula", "Sh2-162", "Caldwell 11"]
description: "Туманність Бульбашка — емісійна туманність (область H II) у сузір'ї Кассіопеї. Майже ідеально кругла оболонка видута потужним зоряним вітром гарячої масивної зорі BD+60°2522, що світиться всередині «бульбашки» й підсвічує навколишню молекулярну хмару."
extended_description: "NGC 7635 відкрив Вільям Гершель у листопаді 1787 року. Туманність розташована на відстані від 7 100 до 11 000 світлових років, а сама оболонка має радіус близько 3–5 світлових років при видимому розмірі 15′×8′. Центральна зоря BD+60°2522 (SAO 20575) має масу приблизно 44 сонячних; її швидкий зоряний вітер тисне на речовину навколишньої молекулярної хмари й формує сферичну ударну оболонку, а ультрафіолетове випромінювання зорі змушує газ світитися. Бульбашка лежить у великій області іонізованого водню поруч із розсіяним скупченням M52. На цьому фото поєднано дані RGB (UV/IR-cut) та вузькосмугового фільтра SII+OIII."
