id: ngc6960
name: "Туманність Західна Вуаль"
type: "Залишок наднової"
constellation: "Лебідь"
aliases: ["NGC 6960", "Western Veil Nebula", "Caldwell 34", "Мітла Відьми", "частина Петлі Лебедя"]
distance_ly: 2400
description: "Західна частина Петлі Лебедя - великого залишку наднової у сузір'ї Лебедя. Туманність простягається повз яскраву зорю 52 Лебедя, за що отримала назву «Мітла Відьми». Волокнисті структури світяться завдяки ударним хвилям від вибуху наднової, що стався 10-20 тисяч років тому."
extended_description: "NGC 6960 - яскрава західна частина Петлі Лебедя (Cygnus Loop), масивного залишку наднової, що охоплює близько 3 градусів на небі. Крізь туманність проходить видима неозброєним оком зоря 52 Лебедя, яка фізично не пов'язана з туманністю, але надає їй характерного вигляду мітли - звідси народна назва «Мітла Відьми» (Witch's Broom). Мереживні волокна утворюються на межі ударної хвилі, де розігрітий газ випромінює світло: червоний колір дає іонізований водень (Hα) та азот (NII), а синьо-зелений - іонізований кисень (OIII). Разом зі Східною Вуаллю (NGC 6992) та трикутником Пікерінга ця туманність складає один з найвидовищніших залишків наднових на нічному небі."
