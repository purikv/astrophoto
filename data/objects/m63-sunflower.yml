id: m63
name: "Галактика Соняшник"
type: "Галактика"
constellation: "Гончі Пси"
aliases: ["Messier 63", "M63", "NGC 5055", "Sunflower Galaxy"]
distance_ly: 29000000
description: "Спіральна галактика з численними короткими тісно закрученими рукавами, що нагадують пелюстки соняшника. Належить до групи галактик M51 у сузір'ї Гончих Псів."
extended_description: "M63 (Галактика Соняшник) — спіральна галактика типу Sbc на відстані близько 29 мільйонів світлових років. Її діаметр становить приблизно 100 000 світлових років. Галактика має так звану флокулентну структуру — замість кількох чітких великих рукавів вона демонструє безліч коротких фрагментованих спіральних елементів, що створюють ефект пелюсток соняшника. Навколо диска спостерігається велике гало з зоряних потоків — залишки поглинутої карликової галактики-супутника. Разом з M51 (Водоворот) та іншими галактиками утворює групу M51."
