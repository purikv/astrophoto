id: m101
name: "Галактика Вертушка"
type: "Галактика"
constellation: "Велика Ведмедиця"
aliases: ["Messier 101", "M101", "NGC 5457", "Pinwheel Galaxy"]
distance_ly: 21000000
description: "Велика спіральна галактика типу grand design, одна з найбільших та найяскравіших галактик у сусідньому Всесвіті. Має діаметр близько 170 000 світлових років — майже вдвічі більше за Чумацький Шлях."
extended_description: "M101 вирізняється асиметричною спіральною структурою, спричиненою гравітаційною взаємодією з галактиками-супутниками. У її спіральних рукавах спостерігається активне зореутворення з численними областями H II. Галактика містить понад трильйон зірок і має низьку поверхневу яскравість, що робить її складним об'єктом для спостережень."
