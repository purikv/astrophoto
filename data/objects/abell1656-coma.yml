id: abell1656
name: "Скупчення галактик у Волоссі Вероніки"
type: "Скупчення галактик"
constellation: "Волосся Вероніки"
aliases: ["Abell 1656", "Coma Cluster"]
distance_ly: 320000000
description: "Одне з найбільших і найближчих багатих скупчень галактик, що містить понад 1000 галактик. Розташоване у сузір'ї Волосся Вероніки на відстані близько 320 мільйонів світлових років."
extended_description: "Скупчення Коми є одним з найкраще вивчених скупчень галактик. У центрі домінують дві гігантські еліптичні галактики — NGC 4874 та NGC 4889. Скупчення є частиною Надскупчення Коми і має масу порядку 10^15 мас Сонця. Саме при вивченні цього скупчення Фріц Цвіккі у 1933 році вперше виявив ознаки існування темної матерії."
