id: ngc6992
name: "Туманність Східна Вуаль"
type: "Залишок наднової"
constellation: "Лебідь"
aliases: ["NGC 6992", "Eastern Veil Nebula", "Caldwell 33", "частина Петлі Лебедя"]
distance_ly: 2400
description: "Східна частина Петлі Лебедя - великого залишку наднової у сузір'ї Лебедя. Туманність утворилася внаслідок вибуху наднової, що стався приблизно 10-20 тисяч років тому. Тонкі волокнисті структури світяться завдяки ударним хвилям, що розповсюджуються в міжзоряному середовищі."
extended_description: "NGC 6992 - яскрава східна частина Петлі Лебедя (Cygnus Loop), масивного залишку наднової, що охоплює близько 3 градусів на небі (у шість разів більше за видимий діаметр повного Місяця). Вибух наднової, що породив цю структуру, стався 10-20 тисяч років тому. Характерні мереживні волокна утворюються на межі ударної хвилі, де розігрітий газ випромінює світло: червоний колір дає іонізований водень (Hα) та азот (NII), а синьо-зелений - іонізований кисень (OIII). Попри значну фізичну протяжність, поверхнева яскравість туманності низька, тому вона є складним об'єктом для візуальних спостережень, але вражає на астрофотографіях."
