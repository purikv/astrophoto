id: sh2-157
name: "Туманність Клешня Омара"
type: "Емісійна туманність"
constellation: "Кассіопея"
aliases: ["Sh2-157", "Lobster Claw Nebula", "Sharpless 157"]
description: "Клешня Омара — велика емісійна туманність кільцеподібної форми на межі сузір'їв Кассіопеї та Цефея. Її характерні «клешні» утворені зоряними вітрами кількох масивних зір-гігантів, а південну частину підсвічують гарячі зорі класу O."
extended_description: "Sh2-157 входить до великого туманнісного комплексу навколо зоряної асоціації Cassiopeia OB2 у щільній ділянці спірального рукава Галактики. Всередині туманності розташоване молоде розсіяне скупчення Markarian 50 (Basel 3). Кільцеву форму туманності сформували потужні зоряні вітри кількох зір-гігантів, тоді як її південний сектор іонізується випромінюванням яскравих зір класу O. Туманність внесена до каталогу Шарплесса; поблизу на небі лежать Туманність Бульбашка (NGC 7635) та скупчення M52."
