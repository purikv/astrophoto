description: "Емісійна туманність у сузір'ї Єдинорога, що оточує молоде розсіяне скупчення NGC 2244. Має характерну форму квітки троянди з темною центральною порожниною, утвореною зоряними вітрами молодих гарячих зірок скупчення."
