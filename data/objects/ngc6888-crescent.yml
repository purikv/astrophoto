id: ngc6888
name: "Туманність Півмісяць"
type: "Емісійна туманність"
constellation: "Лебідь"
aliases: ["NGC 6888", "Crescent Nebula", "Caldwell 27", "Sharpless 105"]
distance_ly: 5000
description: "Туманність Півмісяць - емісійна туманність у сузір'ї Лебедя, утворена потужним зоряним вітром зорі Вольфа-Райє WR 136. Швидкий вітер зорі наздоганяє речовину, скинуту нею раніше на стадії червоного гіганта, формуючи характерну оболонку у формі півмісяця."
extended_description: "NGC 6888 - результат бурхливої еволюції масивної зорі WR 136, що перебуває на стадії Вольфа-Райє - одній з фінальних фаз життя зір з масою у понад 20 разів більшою за сонячну. Близько 250-400 тисяч років тому зоря скинула зовнішні шари на стадії червоного надгіганта, а тепер її надзвичайно швидкий зоряний вітер (близько 1700 км/с) наздоганяє й стискає цю повільнішу оболонку. На фронті зіткнення утворюються дві ударні хвилі: зовнішня іонізує газ, змушуючи його світитися в лініях водню (Hα) та кисню (OIII), що надає туманності характерних червоних і синьо-зелених відтінків. Оболонка простягається приблизно на 25 світлових років, а сама WR 136 у майбутньому, ймовірно, вибухне як наднова."
