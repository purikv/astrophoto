id: m13
name: "Велике скупчення в Геркулесі"
type: "Кулясте скупчення"
constellation: "Геркулес"
aliases: ["Messier 13", "M13", "NGC 6205", "Great Hercules Cluster"]
distance_ly: 22200
description: "Одне з найвідоміших і найяскравіших кулястих скупчень північної півкулі. Містить близько 300 тисяч зір, що утворюють щільне сферичне утворення в сузір'ї Геркулеса. За темного неба видиме неозброєним оком як слабка туманна пляма між зорями η та ζ Геркулеса."
extended_description: "M13 (NGC 6205) було відкрите Едмондом Галлеєм у 1714 році і занесене до каталогу Мессьє у 1764 році. Знаходиться на відстані близько 22 200 світлових років від Землі та має діаметр приблизно 145 світлових років. Скупчення містить понад 300 тисяч зір, переважно старих з дуже низькою металічністю — їхній вік оцінюється у 11,65 мільярда років. У 1974 році з радіотелескопа Аресібо у напрямку M13 було надіслано знамените радіопослання — перше навмисне міжзоряне повідомлення людства, адресоване ймовірним позаземним цивілізаціям."
