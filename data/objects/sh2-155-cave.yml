id: sh2-155
name: "Туманність Печера"
type: "Емісійна туманність"
constellation: "Цефей"
aliases: ["Sh2-155", "Cave Nebula", "Caldwell 9", "LBN 529"]
distance_ly: 2400
description: "Туманність Печера — дифузна емісійна туманність в сузір'ї Цефея на відстані близько 2 400 світлових років. Свою назву отримала завдяки вигнутій дузі яскравого газу, що нагадує вхід до печери, на тлі темних пилових хмар."
extended_description: "Sh2-155 уперше відзначена як галактична емісійна туманність у розширеному другому виданні каталогу Шарплесса 1959 року; популярну назву «Печера» запропонував Патрік Мур. Туманність має видимий розмір близько 50′×30′ і радіус приблизно 35 світлових років. Вона входить до асоціації Cep OB3: газ іонізують молоді гарячі зорі класу O, зокрема HD 217086. Випромінювання цих зір стискає сусідню молекулярну хмару Cepheus B, запускаючи в ній народження нових зір, тож Печера — приклад активної області зореутворення."
