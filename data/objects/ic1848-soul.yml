id: ic1848
name: "Туманність Душа"
type: "Емісійна туманність"
constellation: "Кассіопея"
aliases: ["IC 1848", "Soul Nebula", "Westerhout 5"]
distance_ly: 7500
description: "Велика емісійна туманність в сузір'ї Кассіопеї, що разом із сусідньою IC 1805 (Туманність Серце) утворює відому пару «Серце і Душа»."
extended_description: "IC 1848 — область активного зореутворення, розташована у рукаві Персея нашої Галактики. Туманність містить кілька невеликих відкритих скупчень та яскравих областей іонізованого водню. Разом із IC 1805 вони утворюють один з найбільш фотогенічних комплексів на зимовому небі. Яскраві молоді зорі всередині туманності збуджують навколишній газ, надаючи йому характерного червоного свічення в лінії H-alpha."
