id: m51
name: "Галактика Вир"
type: "Галактика"
constellation: "Гончі Пси"
aliases: ["Messier 51", "M51", "NGC 5194", "Whirlpool Galaxy"]
distance_ly: 23000000
description: "Велика спіральна галактика з чітко вираженими спіральними рукавами, що взаємодіє з меншою галактикою-компаньйоном NGC 5195. Одна з найвідоміших і найфотогенічніших галактик на небі. Саме на прикладі M51 лорд Росс у 1845 році вперше виявив спіральну структуру галактик."
extended_description: "M51 має діаметр близько 76 000 світлових років і є одним з найяскравіших прикладів галактики grand design — з двома чіткими, симетричними спіральними рукавами. Гравітаційна взаємодія з галактикою-компаньйоном NGC 5195 підсилює спіральну структуру та стимулює зореутворення в рукавах. У центрі галактики знаходиться активне ядро типу Сейферт-2 з надмасивною чорною дірою."
