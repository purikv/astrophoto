id: ngc2024
name: "NGC 2024 та Barnard 33"
type: "Туманність"
constellation: "Оріон"
aliases: ["NGC 2024", "Flame Nebula", "Barnard 33", "Horsehead Nebula", "IC 434"]
distance_ly: 1400
description: "NGC 2024 (Туманність Полум'я) — емісійна туманність поблизу зірки Альнітак (східна зірка Пояса Оріона). Barnard 33 (Туманність Кінська Голова) — темна туманність, міжзоряна хмара пилу характерної форми. Обидві туманності є частиною хмарного комплексу Оріон В на відстані близько 1400 світлових років."
extended_description: "NGC 2024 (Туманність Полум'я) — емісійна туманність з активним зореутворенням у сузір'ї Оріона. Освітлюється наднадгігантом Альнітак, східною зіркою Пояса Оріона. Має яскраве ядро радіусом близько 3 світлових років. Barnard 33 (Туманність Кінська Голова) — темна туманність, що розташована на тлі емісійної туманності IC 434. Її характерна форма голови коня утворена щільною хмарою космічного пилу висотою близько 5 світлових років. Обидва об'єкти є частиною хмарного комплексу Оріон В на відстані приблизно 1400 світлових років від Землі."
