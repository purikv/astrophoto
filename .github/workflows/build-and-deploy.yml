name: Build & Deploy Gallery
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; queued runs wait instead of failing
# with "Deployment request failed ... due to in progress deployment".
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install root dependencies (for tools)
        run: npm ci

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Validate YAML files
        run: npm run validate

      - name: Cache thumbnails
        uses: actions/cache@v4
        with:
          path: thumbnails
          key: thumbnails-${{ hashFiles('images/**/*', 'data/sessions/*.yml', 'tools/make-thumbs.mjs') }}
          restore-keys: |
            thumbnails-

      - name: Generate thumbnails (incremental)
        run: npm run thumbs

      - name: Type-check site
        working-directory: site
        run: npm run check

      # Only thumbnails are published: the site never links to images/ originals,
      # and copying them (~774 MB) made the Pages artifact time out on deploy.
      - name: Copy thumbnails to public (for Astro to process)
        run: |
          mkdir -p site/public/thumbnails
          cp -r thumbnails/* site/public/thumbnails/

      - name: Build site (includes gallery.json generation)
        working-directory: site
        run: npm run build

      - name: Verify thumbnails in dist
        run: |
          if [ ! -d site/dist/thumbnails ] || [ -z "$(ls -A site/dist/thumbnails)" ]; then
            echo "::error::No thumbnails in site/dist/thumbnails — build is broken"
            exit 1
          fi
          echo "Thumbnails OK ($(ls site/dist/thumbnails | wc -l) files)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
